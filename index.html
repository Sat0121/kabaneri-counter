<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="カバネリ">
<title>カバネリ カウントツール</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#274777">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}
/* Layout: one-screen Material 3 app shell — top app bar + primary tabs, scrolling content, bottom app bar; two columns on wide screens. */
:root{--primary:#405f90;--on-primary:#ffffff;--primary-container:#d6e3ff;--on-primary-container:#274777;--secondary:#555f71;--on-secondary:#ffffff;--secondary-container:#dae2f9;--on-secondary-container:#3e4758;--tertiary:#6f5575;--on-tertiary:#ffffff;--tertiary-container:#f9d8fd;--on-tertiary-container:#563e5c;--error:#ba1a1a;--on-error:#ffffff;--error-container:#ffdad6;--on-error-container:#93000a;--surface:#f9f9ff;--on-surface:#191c20;--on-surface-variant:#44474e;--surface-container-lowest:#ffffff;--surface-container-low:#f3f3fa;--surface-container:#ededf4;--surface-container-high:#e7e8ee;--surface-container-highest:#e2e2e9;--outline:#74777f;--outline-variant:#c4c6cf;--inverse-surface:#2e3036;--inverse-on-surface:#f0f0f7;--inverse-primary:#a9c7ff;--scrim:#000000;--mumei:#ba1832;--on-mumei:#ffffff;--mumei-container:#ffdad9;--on-mumei-container:#400009;--ikoma:#016d38;--on-ikoma:#ffffff;--ikoma-container:#9bf6b2;--on-ikoma-container:#00210d;--hint-even:#a8326b;--hint-odd:#1f5fa8;--hint-high:#775a00;--hint-fix:#2a6b2a;--hint-six:#ba1a1a;--good:#2a6b2a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--primary:#a9c7ff;--on-primary:#08305f;--primary-container:#274777;--on-primary-container:#d6e3ff;--secondary:#bdc7dc;--on-secondary:#283141;--secondary-container:#3e4758;--on-secondary-container:#dae2f9;--tertiary:#dcbce1;--on-tertiary:#3f2845;--tertiary-container:#563e5c;--on-tertiary-container:#f9d8fd;--error:#ffb4ab;--on-error:#690005;--error-container:#93000a;--on-error-container:#ffdad6;--surface:#111318;--on-surface:#e2e2e9;--on-surface-variant:#c4c6cf;--surface-container-lowest:#0c0e13;--surface-container-low:#191c20;--surface-container:#1d2024;--surface-container-high:#282a2f;--surface-container-highest:#33353a;--outline:#8e9099;--outline-variant:#44474e;--inverse-surface:#e2e2e9;--inverse-on-surface:#2e3036;--inverse-primary:#405f90;--scrim:#000000;--mumei:#ffb3b3;--on-mumei:#680014;--mumei-container:#920021;--on-mumei-container:#ffdad9;--ikoma:#80d998;--on-ikoma:#00391a;--ikoma-container:#005228;--on-ikoma-container:#9bf6b2;--hint-even:#f8a8cf;--hint-odd:#9ecaff;--hint-high:#e9c349;--hint-fix:#8fd88f;--hint-six:#ffb4ab;--good:#8fd88f;color-scheme:dark}}
:root[data-theme="dark"]{--primary:#a9c7ff;--on-primary:#08305f;--primary-container:#274777;--on-primary-container:#d6e3ff;--secondary:#bdc7dc;--on-secondary:#283141;--secondary-container:#3e4758;--on-secondary-container:#dae2f9;--tertiary:#dcbce1;--on-tertiary:#3f2845;--tertiary-container:#563e5c;--on-tertiary-container:#f9d8fd;--error:#ffb4ab;--on-error:#690005;--error-container:#93000a;--on-error-container:#ffdad6;--surface:#111318;--on-surface:#e2e2e9;--on-surface-variant:#c4c6cf;--surface-container-lowest:#0c0e13;--surface-container-low:#191c20;--surface-container:#1d2024;--surface-container-high:#282a2f;--surface-container-highest:#33353a;--outline:#8e9099;--outline-variant:#44474e;--inverse-surface:#e2e2e9;--inverse-on-surface:#2e3036;--inverse-primary:#405f90;--scrim:#000000;--mumei:#ffb3b3;--on-mumei:#680014;--mumei-container:#920021;--on-mumei-container:#ffdad9;--ikoma:#80d998;--on-ikoma:#00391a;--ikoma-container:#005228;--on-ikoma-container:#9bf6b2;--hint-even:#f8a8cf;--hint-odd:#9ecaff;--hint-high:#e9c349;--hint-fix:#8fd88f;--hint-six:#ffb4ab;--good:#8fd88f;color-scheme:dark}
:root{
  --font: Roboto, "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
  --num: "Roboto Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --r-xs:4px; --r-s:8px; --r-m:12px; --r-l:16px; --r-xl:28px; --r-full:999px;
  --gut-l:max(16px, env(safe-area-inset-left, 0px)); --gut-r:max(16px, env(safe-area-inset-right, 0px));
}
html,body{height:100%}
body{background:var(--surface);color:var(--on-surface);font-family:var(--font);font-size:14px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
button:disabled{cursor:default;opacity:.38}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
svg.ic{width:20px;height:20px;fill:currentColor;flex:none}
#app{height:100%;display:flex;flex-direction:column}

/* top app bar */
.topbar{background:var(--surface-container);padding-left:var(--gut-l);padding-right:var(--gut-r);flex:none;position:relative;z-index:5}
.topbar .row{height:56px;display:flex;align-items:center;gap:8px}
.topbar h1{font-size:clamp(17px,4.6vw,20px);font-weight:500;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
.topbar h1 small{font-size:12px;color:var(--on-surface-variant);font-weight:400;margin-left:8px}
.iconbtn{width:40px;height:40px;border-radius:var(--r-full);display:grid;place-items:center;color:var(--on-surface-variant);position:relative}
.iconbtn:hover:not(:disabled){background:color-mix(in srgb,var(--on-surface) 8%,transparent)}
.iconbtn:active:not(:disabled){background:color-mix(in srgb,var(--on-surface) 14%,transparent)}
.tabs{display:flex}
.tabs button{flex:1;height:48px;font-weight:500;color:var(--on-surface-variant);position:relative;letter-spacing:.02em}
.tabs button[aria-selected="true"]{color:var(--primary)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:50%;bottom:0;width:56px;height:3px;border-radius:3px 3px 0 0;background:var(--primary);transform:translateX(-50%)}

/* content */
#main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-left:var(--gut-l);padding-right:var(--gut-r);padding-block:0 24px;overflow-anchor:none}
.cols{max-width:1180px;margin:0 auto;display:grid;gap:0 24px}
.col{min-width:0;display:flex;flex-direction:column;gap:12px;padding-bottom:8px;container-type:inline-size}
.col>h2{display:none;font-size:16px;font-weight:500;margin:16px 0 0;color:var(--on-surface-variant)}
.subnav{position:sticky;top:0;z-index:3;background:var(--surface);padding-block:8px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
.subnav::-webkit-scrollbar{display:none}
.chip{height:32px;padding:0 14px;border-radius:var(--r-s);border:1px solid var(--outline);color:var(--on-surface-variant);font-weight:500;font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:none}
.chip[aria-pressed="true"],.chip.on{background:var(--secondary-container);color:var(--on-secondary-container);border-color:transparent}
.chip:hover:not(:disabled){background:color-mix(in srgb,var(--on-surface) 8%,transparent)}
.chip.on:hover{background:color-mix(in srgb,var(--on-secondary-container) 10%,var(--secondary-container))}
/* compact (<600): tabs, one column · medium (600–839): tabs, wider single column · expanded (840+): two columns · large (1240+): data panel docked */
.cols{max-width:640px}
@media (min-width:600px){ .cols{max-width:760px} #main{padding-block:0 32px} }
@media (min-width:840px){
  .tabs{display:none}
  .cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr);max-width:1180px}
  #col-normal{display:flex !important}
  #col-normal>h2{display:block}
  .subnav{display:none}
}
.col[hidden]{display:none}
@media (max-width:379.98px){ .botbar .grow .btn{padding:0 12px} .botbar .grow .btn span{display:none} .bellcnt{padding:0 4px} }
@media (max-width:359.98px){ .topbar h1 small{display:none} .itemrow{gap:8px;padding-inline:12px} .btn{padding:0 14px} }
@media (max-height:480px) and (orientation:landscape){ .topbar .row{height:44px} .tabs button{height:36px} .botbar{padding-block:4px} .fab{width:40px;height:40px} }
@media (min-width:1240px){
  body.docked{display:grid;grid-template-columns:minmax(0,1fr) clamp(360px,28vw,440px)}
  body.docked #app{grid-column:1;min-width:0}
  body.docked #sheet{position:static;grid-column:2;background:none;height:100%;min-height:0;border-left:1px solid var(--outline-variant)}
  body.docked .sheet{max-width:none;max-height:none;height:100%;margin:0;border-radius:0;animation:none;background:var(--surface-container-low)}
  body.docked .sheet .grab, body.docked .sheet [data-act="sheet-close"], body.docked .botbar [data-act="sheet"].btn{display:none}
  body.docked .sheet .sh-head{padding-top:14px}
  body.docked .bellcnt{pointer-events:none}
}
/* right-column switch (wide) + day log */
.rswitch{display:flex;margin-top:10px;border-bottom:1px solid var(--outline-variant)}
@media (max-width:839.98px){.rswitch{display:none}}
.rswitch button{height:40px;padding:0 16px;font-weight:500;color:var(--on-surface-variant);position:relative}
.rswitch button[aria-selected="true"]{color:var(--primary)}
.rswitch button[aria-selected="true"]::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--primary)}
.ceil{font-size:13px;color:var(--on-surface-variant)} .ceil b{font-size:18px;color:var(--primary);font-weight:700}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px 16px;margin-top:8px}
.statgrid .line{margin-top:6px;flex-wrap:nowrap}
.pernum{min-width:76px;text-align:center;font-size:14px} .pernum b{font-size:22px;font-weight:500;margin-right:2px}
.dots{display:flex;gap:6px;margin-top:8px} .dots i{flex:1;max-width:32px;height:6px;border-radius:3px;background:var(--surface-container-highest)} .dots i.done{background:var(--secondary)} .dots i.now{background:var(--primary)}
.pbars{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:12px 0 4px;text-align:center;align-items:end}
.pbars div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px}
.pbars i{width:70%;max-width:36px;border-radius:3px 3px 0 0;background:var(--surface-container-highest)} .pbars i.has{background:var(--primary)}
.tl{margin:8px -4px 0;border-top:1px solid var(--outline-variant)}
.tlrow{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:10px 4px;border-bottom:1px solid var(--outline-variant)}
.tlrow:last-child{border-bottom:0}
.tlrow:hover{background:color-mix(in srgb,var(--on-surface) 6%,transparent)}
.tlrow .txt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.tln{width:24px;height:24px;border-radius:50%;background:var(--surface-container-highest);display:grid;place-items:center;font-size:12px;flex:none;margin-top:1px}
.tag{font-size:11px;font-weight:700;padding:1px 8px;border-radius:var(--r-full);background:var(--secondary-container);color:var(--on-secondary-container)}
.tag.ok{background:color-mix(in srgb,var(--good) 20%,transparent);color:var(--good)} .tag.ng{background:var(--surface-container-highest);color:var(--on-surface-variant)}
.stl{color:var(--primary);font-weight:500}
ol.flow{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:13px} ol.flow b{margin-right:8px}
.dialog.entry{width:min(94%,480px);animation:none} .dialog.entry h2{font-size:20px} .dialog.entry .togs{margin:6px 0 10px}
/* cards */
.card{background:var(--surface-container-low);border-radius:var(--r-m);padding:clamp(12px,3.6cqi,16px);min-width:0}
.card.cz.mumei{background:var(--mumei-container);color:var(--on-mumei-container);--acc:var(--mumei);--on-acc:var(--on-mumei)}
.card.cz.ikoma{background:var(--ikoma-container);color:var(--on-ikoma-container);--acc:var(--ikoma);--on-acc:var(--on-ikoma)}
.cz .switch:checked{background:var(--acc);border-color:var(--acc)}.cz .switch:checked::after{background:var(--on-acc)}
.cz .switch{border-color:color-mix(in srgb,currentColor 55%,transparent);background:transparent}.cz .switch::after{background:color-mix(in srgb,currentColor 60%,transparent)}
.czgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr))}
.cz header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cz h3{margin:0;font-size:16px;font-weight:500}
.cz h3 b{font-size:22px;font-weight:700;margin-right:8px}
.switchlab{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;cursor:pointer}
.switch{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:var(--r-full);border:2px solid var(--outline);background:var(--surface-container-highest);position:relative;cursor:pointer;margin:0;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:50%;left:5px;width:12px;height:12px;border-radius:50%;background:var(--outline);transform:translateY(-50%);transition:all .15s}
.switch:checked{background:var(--primary);border-color:var(--primary)}
.switch:checked::after{left:20px;width:18px;height:18px;background:var(--on-primary)}
.ptrow{display:flex;align-items:baseline;gap:6px;margin-top:8px;flex-wrap:wrap}
.pt{font-size:clamp(40px,11cqi,52px);line-height:1;font-weight:500;letter-spacing:-.02em}
.pt.bump{animation:bump .25s ease-out}
@keyframes bump{from{transform:scale(1.12)}to{transform:scale(1)}}
.ptrow .avg{margin-left:auto;font-size:12px;opacity:.85}
.meter{height:8px;border-radius:var(--r-full);background:color-mix(in srgb,var(--acc) 22%,transparent);position:relative;margin-top:10px}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:var(--r-full);background:var(--acc);transition:width .25s}
.meter b{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:2px;background:var(--on-surface);transform:translateX(-50%)}
.scale{display:flex;justify-content:space-between;font-size:11px;opacity:.75;margin-top:4px}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(58px,1fr));gap:8px;margin-top:12px}
.act{min-height:56px;border-radius:var(--r-l);background:var(--surface-container-lowest);color:var(--on-surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:500;font-size:13px;padding:6px 4px;transition:transform .08s}
.act b{font-size:16px;font-weight:700;color:var(--acc)}
.act:active{transform:scale(.95)}
.act.enter{background:var(--acc);color:var(--on-acc);width:100%;margin-top:8px;min-height:48px;flex-direction:row;gap:6px;font-size:14px}
.act.enter b{color:inherit;font-size:14px}
.hintbtns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn{height:40px;padding:0 20px;border-radius:var(--r-full);font-weight:500;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn svg.ic{width:18px;height:18px}
.btn.filled{background:var(--primary);color:var(--on-primary)}
.btn.tonal{background:var(--secondary-container);color:var(--on-secondary-container)}
.btn.outlined{border:1px solid var(--outline);color:var(--primary)}
.btn.text{color:var(--primary);padding:0 12px}
.btn.danger{background:var(--error);color:var(--on-error)}
.btn.sm{height:32px;padding:0 14px;font-size:13px}
.cz .btn.outlined{border-color:color-mix(in srgb,currentColor 45%,transparent);color:inherit;flex:1}
.douran h3{margin:0;font-size:15px;font-weight:500}
.douran p{margin:2px 0 10px;font-size:12px;color:var(--on-surface-variant)}
.douran .row{display:flex;gap:8px;flex-wrap:wrap}
.douran .btn{flex:1}
.cardhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cardhead h3{margin:0;font-size:15px;font-weight:500;flex:1;min-width:0}
.flashrow{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;align-items:baseline}
.flashrow span b{font-size:20px;font-weight:500;margin:0 2px 0 6px}
.flashrow .rate{margin-left:auto}
.flashrow .rate b{color:var(--primary);font-size:24px}
.muted{color:var(--on-surface-variant)}
.small{font-size:12px}
table.pts{width:100%;border-collapse:collapse;margin-top:10px;text-align:center}
table.pts th,table.pts td{padding:8px 4px;border-bottom:1px solid var(--outline-variant)}
table.pts th{font-weight:500;color:var(--on-surface-variant);font-size:12px}
table.pts td:first-child{text-align:left;color:var(--on-surface-variant)}
.collapse{display:flex;align-items:center;width:100%;gap:8px;text-align:left;min-height:32px}
.collapse .chev{margin-left:auto;transition:transform .2s;color:var(--on-surface-variant)}
.collapse[aria-expanded="true"] .chev{transform:rotate(180deg)}

/* setting-hint categories */
.cat{padding:0;overflow:hidden}
.cat>.collapse{padding:10px 16px;min-height:48px}
.cat .ttl{font-size:15px;font-weight:500}
.badge{min-width:22px;height:22px;padding:0 7px;border-radius:var(--r-full);background:var(--primary);color:var(--on-primary);font-size:12px;font-weight:700;display:inline-grid;place-items:center}
.solo{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:var(--r-s);background:var(--surface-container-highest);font-size:11px;color:var(--on-surface-variant);white-space:nowrap}
.solo b{color:var(--on-surface);font-weight:700}
.solo.hi{background:var(--tertiary-container);color:var(--on-tertiary-container)}
.solo.hi b{color:inherit}
.rows{border-top:1px solid var(--outline-variant)}
.itemrow{display:flex;align-items:center;gap:12px;padding:8px 16px;min-height:56px;width:100%;text-align:left}
.itemrow+.itemrow{border-top:1px solid var(--outline-variant)}
.itemrow .txt{flex:1;min-width:0}
.itemrow .lab{font-weight:500;overflow-wrap:anywhere}
.hint{display:inline-block;margin-top:3px;padding:1px 8px;border-radius:var(--r-s);font-size:11.5px;background:color-mix(in srgb,var(--hc) 16%,transparent);color:var(--hc);--hc:var(--on-surface-variant);font-weight:500}
.hint.even{--hc:var(--hint-even)} .hint.odd{--hc:var(--hint-odd)} .hint.high{--hc:var(--hint-high)} .hint.fix{--hc:var(--hint-fix)} .hint.six{--hc:var(--hint-six)}
.ratio{font-size:12px;color:var(--on-surface-variant);margin-left:8px}
.stepper{display:flex;align-items:center;gap:4px;flex:none}
.stepper .cnt{min-width:32px;text-align:center;font-size:18px;font-weight:500}
.rbtn{width:36px;height:36px;border-radius:var(--r-full);display:grid;place-items:center;background:var(--surface-container-highest);color:var(--on-surface)}
.rbtn svg.ic{width:18px;height:18px}
.rbtn.plus{background:var(--primary);color:var(--on-primary)}
.rbtn:active:not(:disabled){transform:scale(.92)}
.itemrow.tog .state{font-size:12px;font-weight:500;color:var(--on-surface-variant);padding:4px 12px;border-radius:var(--r-full);border:1px solid var(--outline)}
.itemrow.tog[aria-pressed="true"]{background:color-mix(in srgb,var(--primary) 10%,transparent)}
.itemrow.tog[aria-pressed="true"] .state{background:var(--primary);color:var(--on-primary);border-color:transparent}
.seg{display:flex;margin:12px 16px 4px;border:1px solid var(--outline);border-radius:var(--r-full);overflow:hidden}
.seg button{flex:1;min-height:44px;padding:4px 6px;font-size:12px;font-weight:500;line-height:1.25;position:relative}
.seg button+button{border-left:1px solid var(--outline)}
.seg button[aria-pressed="true"]{background:var(--secondary-container);color:var(--on-secondary-container)}
.seg .n{display:inline-block;margin-left:4px;font-weight:700;color:var(--primary)}
.note{margin:4px 16px 8px;font-size:11.5px;color:var(--on-surface-variant)}

/* bottom app bar */
.botbar{flex:none;background:var(--surface-container);padding:8px var(--gut-r) calc(8px + env(safe-area-inset-bottom,0px)) var(--gut-l);display:flex;align-items:center;gap:4px;z-index:6}
.botbar .grow{flex:1;display:flex;justify-content:center;min-width:0}
.bellbox{display:flex;align-items:center;gap:8px}
.bellcnt{display:flex;align-items:center;gap:4px;height:40px;padding:0 10px;border-radius:var(--r-s);color:var(--on-surface-variant)}
.bellcnt b{font-size:18px;font-weight:500;color:var(--on-surface);min-width:22px;text-align:right}
.fab{width:48px;height:48px;border-radius:var(--r-l);background:var(--primary-container);color:var(--on-primary-container);display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.fab:active{transform:scale(.94)}

/* scrim, sheet, dialogs, menu */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--scrim) 45%,transparent);z-index:20;display:flex}
.sheet{margin:auto auto 0;width:100%;max-width:640px;max-height:92%;background:var(--surface-container-low);border-radius:var(--r-xl) var(--r-xl) 0 0;display:flex;flex-direction:column;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .grab{width:32px;height:4px;border-radius:2px;background:var(--outline);margin:12px auto 4px;flex:none}
.sheet .sh-head{display:flex;align-items:center;padding:4px 12px 4px 24px;flex:none}
.sheet .sh-head h2{flex:1;margin:0;font-size:18px;font-weight:500}
.sheet .sh-body{overflow-y:auto;padding:8px max(24px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:20px}
.fld h3{margin:0 0 8px;font-size:13px;font-weight:500;color:var(--on-surface-variant);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fld h3 .eq{margin-left:auto;color:var(--primary);font-weight:700}
.line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tf{height:48px;min-width:0;width:96px;flex:1;border:1px solid var(--outline);border-radius:var(--r-xs);background:transparent;padding:0 12px;font-family:var(--num);font-size:16px;text-align:right}
.tf:focus{outline:2px solid var(--primary);outline-offset:-1px;border-color:transparent}
.tf.narrow{flex:none;width:76px}
input.tf.txt{width:100%;text-align:left;font-family:var(--font);font-size:15px;margin-top:4px}
textarea.tf{height:auto;padding:10px 12px;text-align:left;font-family:var(--font);width:100%;resize:vertical}
.unit{color:var(--on-surface-variant);font-size:13px}
.big{font-size:22px;font-weight:500}
.pos{color:var(--good)} .neg{color:var(--error)}
.kv{display:flex;gap:6px 16px;flex-wrap:wrap;align-items:baseline;margin-top:8px}
.kv b{color:var(--primary)}
.twin{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.twin>div{background:var(--surface-container);border-radius:var(--r-m);padding:12px;display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.twin .cnt{font-size:24px;font-weight:500;margin-left:6px}
.calc{margin-top:10px;background:var(--surface-container);border-radius:var(--r-m);padding:12px;display:flex;flex-direction:column;gap:10px}
.gchips{display:flex;flex-wrap:wrap;gap:6px}
.gchip{height:32px;border-radius:var(--r-s);background:var(--secondary-container);color:var(--on-secondary-container);display:inline-flex;align-items:center;font-family:var(--num);font-size:13px;overflow:hidden}
.gchip button{height:100%;padding:0 8px}
.gchip button:first-child{padding-left:12px}
.gchip.edit{outline:2px solid var(--primary)}
hr{border:0;border-top:1px solid var(--outline-variant);margin:0;width:100%}
.est .hi{display:flex;align-items:baseline;justify-content:space-between;margin:8px 0}
.est .hi b{font-size:32px;font-weight:500;color:var(--primary)}
.bars{display:flex;flex-direction:column;gap:6px}
.barrow{display:grid;grid-template-columns:44px 1fr 56px;align-items:center;gap:8px;font-size:13px}
.barrow .trk{height:20px;border-radius:var(--r-xs);background:var(--surface-container-highest);overflow:hidden}
.barrow .trk i{display:block;height:100%;border-radius:var(--r-xs);background:var(--secondary);opacity:.55;transition:width .3s}
.barrow.top .trk i{background:var(--primary);opacity:1}
.barrow.top{font-weight:700;color:var(--primary)}
.barrow .v{text-align:right}
.togs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.dialog{margin:auto;width:min(92%,400px);background:var(--surface-container-high);border-radius:var(--r-xl);padding:24px;animation:pop .16s ease-out;max-height:90%;overflow:auto}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.dialog h2{margin:0 0 12px;font-size:22px;font-weight:400}
.dialog p{margin:0 0 8px;color:var(--on-surface-variant)}
.dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;flex-wrap:wrap}
.menu{position:fixed;top:calc(52px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));background:var(--surface-container);border-radius:var(--r-xs);box-shadow:0 2px 8px rgba(0,0,0,.3);padding:8px 0;min-width:220px;z-index:30}
.menu button{display:flex;align-items:center;gap:12px;width:100%;height:48px;padding:0 16px;text-align:left}
.menu button:hover{background:color-mix(in srgb,var(--on-surface) 8%,transparent)}
.menu button.warn{color:var(--error)}
.menu svg.ic{color:var(--on-surface-variant)} .menu .warn svg.ic{color:inherit}
.full{margin:0;width:100%;height:100%;background:var(--surface);display:flex;flex-direction:column;animation:up .2s ease-out}
.full .bar{display:flex;align-items:center;gap:4px;height:56px;padding:0 var(--gut-r) 0 max(4px,env(safe-area-inset-left,0px));flex:none;margin-top:env(safe-area-inset-top,0px)}
.full .bar h2{flex:1;margin:0;font-size:20px;font-weight:400}
.full .tools{display:flex;gap:8px;flex-wrap:wrap;padding:4px var(--gut-r) 12px var(--gut-l);flex:none}
.full .body{flex:1;overflow:auto;padding:0 var(--gut-r) calc(24px + env(safe-area-inset-bottom,0px)) var(--gut-l)}
.full .body img{display:block;margin:0 auto;max-width:min(100%,440px);border-radius:var(--r-m);box-shadow:0 1px 4px rgba(0,0,0,.3)}
pre.report{margin:0 auto;max-width:560px;background:var(--surface-container);border-radius:var(--r-m);padding:16px;font-family:var(--num);font-size:12px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text}
.snack{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--inverse-surface);color:var(--inverse-on-surface);padding:12px 16px;border-radius:var(--r-xs);z-index:50;max-width:calc(100% - 32px);font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,.3);animation:pop .15s}
.swatches{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0 16px}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid transparent;position:relative}
.sw[aria-pressed="true"]{border-color:var(--on-surface)}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.sw.custom{background:conic-gradient(#e53935,#fdd835,#43a047,#1e88e5,#8e24aa,#e53935)}

/* history */
.hist{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding-top:12px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters input[type=date]{height:32px;border:1px solid var(--outline);border-radius:var(--r-s);background:transparent;padding:0 8px;font-size:13px}
.day{font-size:13px;font-weight:500;color:var(--on-surface-variant);margin:8px 0 0}
.rec{padding:0;overflow:hidden}
.rec .collapse{padding:12px 16px}
.rec .meta{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:12px;color:var(--on-surface-variant)}
.rec .tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:var(--r-full);background:var(--secondary-container);color:var(--on-secondary-container)}
.rec .tag.end{background:var(--tertiary-container);color:var(--on-tertiary-container)}
.rec .open{border-top:1px solid var(--outline-variant);padding:12px 16px;display:flex;flex-direction:column;gap:12px}
.rec .open img{max-width:min(100%,440px);margin:0 auto;border-radius:var(--r-m)}
.empty{text-align:center;color:var(--on-surface-variant);padding:48px 0}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

</style>
</head>

<div id="app">
  <div id="home" style="display:contents">
    <header class="topbar">

      </div>

    <button class="iconbtn" id="redo" data-act="redo" aria-label="やり直す"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/></svg></button>
    <div class="grow"><button class="btn tonal" data-act="sheet" aria-label="遊技データ"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"/></svg><span>遊技データ</span></button></div>
    <div class="bellbox">
      <button class="bellcnt" data-act="sheet" aria-label="下段ベル回数。遊技データを開く"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22c1.1 0 2-.9 2-2h-4a2 2 0 0 0 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg><b class="num" id="bellcnt">0</b></button>
      <button class="fab" data-act="bell" data-d="1" aria-label="下段ベル+1"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></button>
    </div>
  </footer>
</div>

  <div class="sheet" role="dialog" aria-label="遊技データ">

    <div class="sh-head"><h2>遊技データ</h2><button class="iconbtn" data-act="sheet-close" aria-label="閉じる"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button></div>

</div>

    h += `<div class="scrim" data-act="dlg-close"><div class="dialog" role="dialog" aria-labelledby="dlg-t" data-stop><h2 id="dlg-t">テーマ</h2><p>表示モード</p><div class="togs">${[['system', 'システム'], ['light', 'ライト'], ['dark', 'ダーク']].map(([k, l]) => `<button class="chip ${S.theme.mode === k ? 'on' : ''}" data-act="t-mode" data-v="${k}" aria-pressed="${S.theme.mode === k}">${l}</button>`).join('')}</div>
    <p>基調色</p><div class="swatches">${seeds.map(c => `<button class="sw" style="background:${c}" data-act="t-seed" data-v="${c}" aria-pressed="${S.theme.seed === c}" aria-label="基調色 ${c}"></button>`).join('')}<label class="sw custom" aria-pressed="${custom}" title="好きな色を選ぶ"><input type="color" id="seed-custom" value="${S.theme.seed}" aria-label="好きな色を選ぶ"></label></div>
    <div class="actions"><button class="btn text" data-act="dlg-close">閉じる</button></div></div></div>`; }
  if (u.result) { const text = u.result.mode === 'text';
    h += `<div class="scrim"><div class="full" role="dialog" aria-label="遊戯結果"><div class="bar"><button class="iconbtn" data-act="res-close" aria-label="閉じる">${ic('close')}</button><h2>${text ? 'テキストデータ' : '遊戯結果'}</h2></div>
    <div class="tools">${text ? `<button class="btn filled sm" data-act="res-copy">${ic('copy')}テキストをコピー</button><button class="btn tonal sm" data-act="res-mode">画像で表示</button>` : `<button class="btn filled sm" data-act="res-save">${ic('save')}画像で保存</button><button class="btn tonal sm" data-act="res-mode">テキストで表示</button>`}<button class="btn outlined sm" data-act="res-share">${ic('share')}SNSでシェア</button></div>
    <div class="body">${text ? `<pre class="report">${esc(textReport(u.result.sn))}</pre>` : `<img id="res-img" alt="カバネリ遊戯結果">`}</div></div></div>`; }
  const keep = $('.dialog.entry')?.scrollTop;
  $('#overlays').innerHTML = h;
  if (keep && $('.dialog.entry')) $('.dialog.entry').scrollTop = keep;
  if (u.result && u.result.mode !== 'text') { try { resultCanvas = drawReport(u.result.sn); $('#res-img').src = resultCanvas.toDataURL('image/png'); } catch { $('#res-img').replaceWith(Object.assign(document.createElement('p'), { className: 'empty', textContent: '画像の生成に失敗しました' })); } }
}

/* ============ history view ============ */
const dayKey = t => fmtDate(t).slice(0, 10);
function renderHistory() {
  const u = S.ui, recs = [...S.records].sort((a, b) => b.at - a.at), dk = u.hDate ? u.hDate.replace(/-/g, '/') : '';
  const list = recs.filter(r => (u.hFilter === 'all' || r.method === u.hFilter) && (!dk || dayKey(r.at) === dk)), filtered = u.hFilter !== 'all' || dk;
  let body;
  if (!recs.length) body = '<div class="empty"><p>まだ遊戯記録がありません</p><p class="small">途中記録または遊戯終了時にデータが保存されます</p></div>';
  else if (!list.length) body = '<div class="empty"><p>条件に一致する記録がありません</p><button class="btn text" data-act="h-clear">フィルターをクリア</button></div>';
  else { let last = ''; body = list.map(r => { const k = dayKey(r.at), sn = r.sn, open = u.hOpen === r.id; let h = '';
      if (k !== last) { last = k; h += `<h3 class="day">${k} (${'日月火水木金土'[new Date(r.at).getDay()]})</h3>`; }
      h += `<section class="card rec"><button class="collapse" data-act="h-open" data-id="${r.id}" aria-expanded="${open}"><span><span class="tag ${r.method}">${r.method === 'end' ? '遊戯終了' : '途中記録'}</span> <span class="num small muted">${fmtDate(r.at).slice(11)}</span>
        <span class="meta num" style="margin-top:4px">${sn.total > 0 ? `<span>${sn.total.toLocaleString()}G</span>` : ''}${sn.data.investment > 0 ? `<span>投資${sn.data.investment}千円</span>` : ''}${sn.balance ? `<span class="${sn.balance >= 0 ? 'pos' : 'neg'}">差枚${sn.balance >= 0 ? '+' : ''}${sn.balance.toLocaleString()}</span>` : ''}${sn.est ? `<span>推測 設定${sn.est.best}</span>` : ''}</span></span><span class="chev">${ic('chev')}</span></button>
        ${open ? `<div class="open"><div class="filters"><button class="chip ${u.hMode === 'image' ? 'on' : ''}" data-act="h-mode" data-v="image">画像</button><button class="chip ${u.hMode === 'text' ? 'on' : ''}" data-act="h-mode" data-v="text">テキスト</button><span style="flex:1"></span>${u.hMode === 'image' ? `<button class="btn text sm" data-act="h-save" data-id="${r.id}">${ic('save')}保存</button>` : `<button class="btn text sm" data-act="h-copy" data-id="${r.id}">${ic('copy')}コピー</button>`}<button class="btn text sm" style="color:var(--error)" data-act="h-del" data-id="${r.id}">${ic('del')}削除</button></div>${u.hMode === 'image' ? '<img id="h-img" alt="遊戯結果">' : `<pre class="report">${esc(textReport(sn))}</pre>`}</div>` : ''}</section>`;
      return h; }).join(''); }
  $('#history').innerHTML = `<div class="hist"><div class="filters">${[['all', 'すべて'], ['save', '途中記録'], ['end', '遊戯終了']].map(([k, l]) => `<button class="chip ${u.hFilter === k ? 'on' : ''}" data-act="h-filter" data-v="${k}" aria-pressed="${u.hFilter === k}">${l}</button>`).join('')}<span style="flex:1"></span><input type="date" id="h-date" value="${u.hDate}" aria-label="日付で絞り込む">${filtered ? '<button class="btn text sm" data-act="h-clear">クリア</button>' : ''}</div>${body}</div>`;
  $('#h-count').textContent = recs.length ? (filtered ? `${list.length}/${recs.length}件` : `${recs.length}件`) : '';
  const img = $('#h-img'); if (img) { const r = S.records.find(x => x.id === u.hOpen); try { img.src = drawReport(r.sn).toDataURL('image/png'); } catch { } }
}

/* ============ commit / render ============ */
function commit() { persist(); render(); }
function render() {
  // 再描画でスクロール位置が先頭に戻らないよう保持する（iOS Safari は中身を差し替えると位置を失う）
  const keep = ['#main', '#history', '#sheet-body'].map(s => [$(s), $(s) ? $(s).scrollTop : 0]);
  renderAll();
  for (const [el, y] of keep) if (el && el.scrollTop !== y) el.scrollTop = y;
}
function renderAll() {
  const home = S.ui.view === 'home';
  $('#home').hidden = !home; $('#histview').hidden = home; $('#botbar').hidden = !home;
  if (home) { const solo = renderMain(); $('#sheet').hidden = !sheetShown(); document.body.classList.toggle('docked', wideMq.matches); updateSheet(solo); } else { $('#sheet').hidden = true; document.body.classList.remove('docked'); renderHistory(); }
  renderOverlays();
}
function route() { S.ui.view = location.hash === '#history' ? 'history' : 'home'; render(); }
function addRecord(method, sn) { S.records.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), at: sn.at, method, sn }); if (S.records.length > 300) S.records.shift(); }

/* ============ events ============ */
const A = {
  add: d => { addPoints(d.cz, d.type); const el = $('#pt-' + d.cz); el.classList.add('bump'); },
  high: d => mutCz(z => { z.high[d.cz] = !z.high[d.cz]; }, z => `${CZ_NAME[d.cz]} 高確 ${z.high[d.cz] ? 'ON' : 'OFF'}`),
  min: d => setMin(d.cz, +d.v, +d.v === 90 ? '残り60pt示唆→90pt' : '残り15pt示唆→135pt'),
  enter: d => enterCZ(d.cz, false), douran: d => enterCZ(d.cz, true),
  hint: d => { const it = CATS.flatMap(c => c.items).find(i => i.key === d.key); hintDelta(d.key, it.label, +d.d, d.range != null ? +d.range : S.ui.range); },
  cat: d => { S.ui.open.has(d.id) ? S.ui.open.delete(d.id) : S.ui.open.add(d.id); render(); },
  range: d => { S.ui.range = +d.v; render(); },
  jump: d => { const el = document.getElementById(d.to); if (!el) return; if (d.to.startsWith('cat-')) S.ui.open.add(d.to.slice(4)); render(); const m = $('#main'), t = document.getElementById(d.to); m.scrollTo({ top: t.getBoundingClientRect().top - m.getBoundingClientRect().top + m.scrollTop - 52, behavior: 'smooth' }); },
  tab: d => { S.ui.tab = d.tab; if (d.tab !== 'normal') S.ui.rtab = d.tab; render(); $('#main').scrollTop = 0; },
  rtab: d => { S.ui.rtab = d.v; if (S.ui.tab !== 'normal') S.ui.tab = d.v; render(); },
  'l-reason': d => { const L = clone(lg()); L.reason = d.v; L.period = Math.min(L.period, ceilOf(L).p); push('log', L, `状態: ${nameOf(REASONS, d.v)}`); },
  'l-sub': d => { const L = clone(lg()); L.sub[d.v] = !L.sub[d.v]; L.period = Math.min(L.period, ceilOf(L).p); push('log', L, `サブ液晶 ${nameOf(SUBS, d.v)} ${L.sub[d.v] ? 'ON' : 'OFF'}`); },
  'l-period': d => { const L = clone(lg()), n = Math.min(L.period, ceilOf(L).p) + +d.d; if (n < 1 || n > ceilOf(L).p) return; L.period = n; push('log', L, `${n}周期目`); },
  'l-new': d => newEntry(d.v),
  'l-edit': d => { const e = lg().entries.find(x => x.id === d.id); if (e) { S.ui.entry = clone(e); if (S.ui.entry.ep === 'unknown') S.ui.entry.ep = 'kirameku'; render(); } },
  'e-bonus': d => { S.ui.entry.bonus = d.v; render(); }, 'e-trigger': d => { S.ui.entry.trigger = d.v; render(); }, 'e-ep': d => { S.ui.entry.ep = d.v; render(); },
  'e-result': d => { S.ui.entry.result = d.v; render(); }, 'e-sttype': d => { S.ui.entry.stType = d.v; render(); }, 'e-kaimon': () => { S.ui.entry.kaimon = !S.ui.entry.kaimon; render(); },
  'e-period': d => { S.ui.entry.period = Math.max(1, Math.min(6, S.ui.entry.period + +d.d)); render(); }, 'e-chain': d => { S.ui.entry.chain = Math.max(0, S.ui.entry.chain + +d.d); render(); },
  'e-cancel': () => { S.ui.entry = null; render(); }, 'e-save': saveEntry,
  'e-del': () => { const id = S.ui.entry.id, L = clone(lg()); L.entries = L.entries.filter(x => x.id !== id); S.ui.entry = null; push('log', L, '初当たりの記録を削除'); },
  undo, redo,
  bell: d => mutCz(z => { if (z.bell + +d.d < 0) return false; z.bell += +d.d; }, z => `下段ベル ${+d.d > 0 ? '+1' : '-1'} (${z.bell})`),
  rb: d => mutCz(z => { if (z.bonus.rb + +d.d < 0) return false; z.bonus.rb += +d.d; }, z => `初当たり ${+d.d > 0 ? '+1' : '-1'} (${z.bonus.rb})`),
  bb: d => mutCz(z => { if (z.bonus.bb + +d.d < 0) return false; z.bonus.bb += +d.d; }, z => `ST突入 ${+d.d > 0 ? '+1' : '-1'} (${z.bonus.bb})`),
  inv: d => { S.data.investment = Math.max(0, S.data.investment + +d.d); commit(); },
  sheet: () => { if (wideMq.matches) return; S.ui.sheet = !S.ui.sheet; render(); }, 'sheet-close': () => { S.ui.sheet = false; render(); },
  calc: () => { S.ui.calc = !S.ui.calc; render(); }, pthist: () => { S.ui.ptHist = !S.ui.ptHist; render(); },
  'bg-add': () => { const el = $('#f-bg'), n = parseInt(el.value, 10); if (isNaN(n) || n < 0) return; if (S.ui.editIdx != null) { S.data.bonusGames[S.ui.editIdx] = n; S.ui.editIdx = null; } else S.data.bonusGames.push(n); el.value = ''; commit(); },
  'bg-pop': () => { S.data.bonusGames.pop(); S.ui.editIdx = null; commit(); },
  'bg-del': d => { S.data.bonusGames.splice(+d.i, 1); S.ui.editIdx = null; commit(); },
  'bg-edit': d => { S.ui.editIdx = S.ui.editIdx === +d.i ? null : +d.i; const el = $('#f-bg'); el.value = S.ui.editIdx != null ? S.data.bonusGames[+d.i] : ''; render(); el.focus(); },
  'bg-apply': () => { S.data.normalCur = S.data.bonusStart + S.data.bonusGames.reduce((a, x) => a + x, 0) + S.data.normalStart; S.ui.calc = false; commit(); },
  factors: () => { S.ui.factors = !S.ui.factors; render(); }, factor: d => { S.excluded[d.k] = !S.excluded[d.k]; commit(); },
  menu: () => { S.ui.menu = !S.ui.menu; render(); }, 'menu-close': () => { S.ui.menu = false; render(); },
  'm-sync': () => { S.ui.menu = false; S.ui.dialog = 'sync'; render(); }, 's-flush': () => flush(true),
  'm-save': () => { const sn = snapshot(); addRecord('save', sn); queueSend(sn, 'save'); S.ui.menu = false; S.ui.result = { sn, mode: 'image' }; commit(); },
  'm-end': () => { S.ui.menu = false; S.ui.dialog = 'end'; render(); }, 'm-reset': () => { S.ui.menu = false; S.ui.dialog = 'reset'; render(); },
  'm-theme': () => { S.ui.menu = false; S.ui.dialog = 'theme'; render(); }, 'm-hist': () => { S.ui.menu = false; location.hash = 'history'; },
  'dlg-close': () => { S.ui.dialog = null; render(); },
  'do-end': () => { const sn = snapshot(); addRecord('end', sn); queueSend(sn, 'end'); resetSession(); S.ui.dialog = null; S.ui.sheet = false; S.ui.result = { sn, mode: 'image' }; commit(); },
  'do-reset': () => { resetSession(); S.ui.dialog = null; commit(); snack('全記録をリセットしました'); },
  'res-close': () => { S.ui.result = null; render(); }, 'res-mode': () => { S.ui.result.mode = S.ui.result.mode === 'text' ? 'image' : 'text'; render(); },
  'res-save': () => resultCanvas && saveImage(resultCanvas, `kabaneri_record_${fileStamp(S.ui.result.sn.at)}.png`),
  'res-copy': () => copyText(textReport(S.ui.result.sn)), 'res-share': () => shareResult(S.ui.result.sn, resultCanvas || drawReport(S.ui.result.sn)),
  't-mode': d => { S.theme.mode = d.v; applyTheme(); commit(); }, 't-seed': d => { S.theme.seed = d.v; applyTheme(); commit(); },
  back: () => { location.hash = ''; },
  'h-filter': d => { S.ui.hFilter = d.v; render(); }, 'h-clear': () => { S.ui.hFilter = 'all'; S.ui.hDate = ''; render(); },
  'h-open': d => { S.ui.hOpen = S.ui.hOpen === d.id ? null : d.id; render(); }, 'h-mode': d => { S.ui.hMode = d.v; render(); },
  'h-save': d => { const r = S.records.find(x => x.id === d.id); saveImage(drawReport(r.sn), `kabaneri_${r.method}_${fileStamp(r.at)}.png`); },
  'h-copy': d => copyText(textReport(S.records.find(x => x.id === d.id).sn)),
  'h-del': d => { S.ui.delId = d.id; S.ui.dialog = 'delrec'; render(); },
  'do-delrec': () => { S.records = S.records.filter(r => r.id !== S.ui.delId); S.ui.dialog = null; S.ui.hOpen = null; commit(); snack('記録を削除しました'); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  if (el.matches('input')) return; // switches handled on change
  if (el.classList.contains('scrim') && e.target !== el) { if (e.target.closest('[data-stop]')) { const inner = e.target.closest('[data-stop] [data-act]'); if (!inner) return; } }
  const t = e.target.closest('[data-act]'); A[t.dataset.act]?.(t.dataset);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.act === 'high') return A.high(t.dataset);
  if (t.id === 's-on') { if (t.checked && (!urlOk(S.sync.url) || !S.sync.name.trim())) { t.checked = false; return snack('ニックネームと送信先URLを入れてからオンにしてください'); } S.sync.on = t.checked; persist(); if (t.checked) flush(); return; }
  if (t.id === 's-url' || t.id === 's-name') { if (S.sync.on && (!urlOk(S.sync.url) || !S.sync.name.trim())) { S.sync.on = false; $('#s-on').checked = false; } return persist(); }
  if (t.id === 'h-date') { S.ui.hDate = t.value; return render(); }
  if (t.id === 'f-memo') { S.data.memo = t.value; return commit(); }
  if (t.id === 'f-bell') { const n = parseInt(t.value, 10); if (!isNaN(n) && n >= 0 && n !== cz().bell) mutCz(z => { z.bell = n; }, () => `下段ベル → ${n}`); else t.value = cz().bell; return; }
  if (NUMF[t.id]) { const k = NUMF[t.id], pos = k === 'exchangeRate' || k === 'exchangePerK'; if (t.value === '' && !pos) S.data[k] = 0; else { const n = parseInt(t.value, 10); if (!isNaN(n) && (pos ? n > 0 : n >= 0)) S.data[k] = n; } t.blur(); return commit(); }
});
document.addEventListener('input', e => {
  const t = e.target, n = parseInt(t.value, 10), v = isNaN(n) || n < 0 ? 0 : n;
  if (t.id === 's-url') { S.sync.url = t.value.trim(); const m = $('#s-urlmsg'), ok = urlOk(S.sync.url); m.textContent = !S.sync.url ? 'URLを貼り付けてください。' : ok ? 'URLの形式は正しいです。' : 'URLの形式が違います。https://script.google.com/macros/s/ で始まり /exec で終わるものを貼り付けてください。'; m.style.color = S.sync.url && !ok ? 'var(--error)' : 'var(--on-surface-variant)'; return; }
  if (t.id === 's-name') { S.sync.name = t.value; return; }
  if (t.id === 'e-g') S.ui.entry.g = v; else if (t.id === 'e-medals') S.ui.entry.medals = v;
  else if (t.id === 'f-lg') { lg().g = v; persist(); updateLogRemain(); }
});
document.addEventListener('input', e => { if (e.target.id === 'seed-custom') { S.theme.seed = e.target.value; applyTheme(); persist(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('input.tf')) { e.preventDefault(); if (e.target.id === 'f-bg') A['bg-add'](); else e.target.blur(); }
  if (e.key === 'Escape') { const u = S.ui; if (u.menu) u.menu = false; else if (u.entry) u.entry = null; else if (u.dialog) u.dialog = null; else if (u.result) u.result = null; else if (u.sheet) u.sheet = false; else return; render(); }
});
document.addEventListener('animationend', e => e.target.classList?.remove('bump'));
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet' && !wideMq.matches) { S.ui.sheet = false; render(); } });
wideMq.addEventListener?.('change', render);
// swipe between tabs (phone layout)
let sx = 0, sy = 0;
$('#main').addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
$('#main').addEventListener('touchend', e => { const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; if (Math.abs(dx) < 80 || Math.abs(dx) < Math.abs(dy) * 2 || S.ui.view !== 'home') return; const order = ['normal', 'st', 'log'], to = order[order.indexOf(S.ui.tab) + (dx < 0 ? 1 : -1)]; if (to && !twoCol.matches) A.tab({ tab: to }); }, { passive: true });
twoCol.addEventListener?.('change', render);
window.addEventListener('hashchange', route);

applyTheme(); buildSheet(); route(); flush();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { });
window.__kabaneri = { estimate, singleFactor, S, buildPayload, snapshot };
})();
